name: Finity Market Data Ingestion Pipeline

on:
  schedule:
    # Run 1: 9:30 AM IST (04:00 UTC) — Indian market opens
    - cron: '0 4 * * *'
    # Run 2: 12:30 PM IST (07:00 UTC) — Indian market mid-session
    - cron: '0 7 * * *'
    # Run 3: 3:45 PM IST (10:15 UTC) — Indian market close + US pre-market
    - cron: '15 10 * * *'
    # Run 4: 7:30 PM IST (14:00 UTC) — US market opens (NYSE/NASDAQ)
    - cron: '0 14 * * *'
    # Run 5: 11:30 PM IST (18:00 UTC) — US market mid-session
    - cron: '0 18 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  ingest-market-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Pipeline Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests

      - name: Configure Git Identity
        run: |
          git config --global user.name 'ShashwatSahu21'
          git config --global user.email 'shashwatsahu2103@gmail.com'

      # ─────────────────────────────────────────────────────────
      #  Run Automated Collection and Commits
      # ─────────────────────────────────────────────────────────
      - name: "Execute dynamic run and commit"
        run: |
          python scripts/run_and_commit.py
