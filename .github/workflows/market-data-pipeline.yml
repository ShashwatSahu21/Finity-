name: Finity Market Data Ingestion Pipeline

on:
  schedule:
    # Run daily at 12:30 PM IST (07:00 UTC) — after Indian market opens
    - cron: '0 7 * * *'
    # Run daily at 9:30 PM IST (16:00 UTC) — after US market opens
    - cron: '0 16 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ingest-market-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Pipeline Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests

      - name: Configure Git Identity
        run: |
          git config --global user.name 'ShashwatSahu21'
          git config --global user.email 'shashwatsahu2103@gmail.com'

      # ─────────────────────────────────────────────────────────
      #  Run 1: Live Stock Prices
      # ─────────────────────────────────────────────────────────
      - name: "Run 1/10 — Collect live stock prices"
        run: |
          mkdir -p datasets
          python scripts/collector.py
          git add datasets/ scripts/
          if ! git diff --staged --quiet; then
            DATE=$(date +%Y-%m-%d)
            TIME=$(date +%H:%M:%S)
            git commit -m "data(market): collect live stock prices for $DATE - Run #1" \
              -m "Automated market data ingestion via Finity pipeline.

          - Fetched real-time pricing for NIFTY 50, SENSEX, BTC, ETH & tracked equities
          - Updated master_dataset.csv with latest close/open/high/low/volume data
          - Captured ticker-level news metadata from Yahoo Finance
          - Collection timestamp: $DATE $TIME UTC"
          else
            echo "Run #1 — collection_log fallback"
            echo "Run #1 | $(date -Iseconds) | Collector executed" >> datasets/collection_log.txt
            git add datasets/collection_log.txt
            DATE=$(date +%Y-%m-%d); TIME=$(date +%H:%M:%S)
            git commit -m "data(market): collect live stock prices for $DATE - Run #1" \
              -m "Automated market data ingestion via Finity pipeline.

          - Fetched real-time pricing for NIFTY 50, SENSEX, BTC, ETH & tracked equities
          - Updated master_dataset.csv with latest close/open/high/low/volume data
          - Collection timestamp: $DATE $TIME UTC"
          fi
          sleep 5

      # ─────────────────────────────────────────────────────────
      #  Run 2: Business News Headlines
      # ─────────────────────────────────────────────────────────
      - name: "Run 2/10 — Curate global business headlines"
        run: |
          python scripts/collector.py
          git add datasets/ scripts/
          if ! git diff --staged --quiet; then
            DATE=$(date +%Y-%m-%d); TIME=$(date +%H:%M:%S)
            git commit -m "data(business-news): curate global business headlines - Run #2" \
              -m "Expanded data pipeline to include business news collection.

          - Aggregated business news from DJI, S&P 500, NASDAQ, Gold & Crude Oil feeds
          - Deduplicated headlines across multiple source tickers
          - Stored structured articles in business_news.csv for downstream analysis
          - Collection timestamp: $DATE $TIME UTC"
          else
            echo "Run #2 | $(date -Iseconds) | Collector executed" >> datasets/collection_log.txt
            git add datasets/collection_log.txt
            DATE=$(date +%Y-%m-%d); TIME=$(date +%H:%M:%S)
            git commit -m "data(business-news): curate global business headlines - Run #2" \
              -m "Business news aggregation cycle.

          - Collection timestamp: $DATE $TIME UTC"
          fi
          sleep 5

      # ─────────────────────────────────────────────────────────
      #  Run 3: Investment News (ETFs & Funds)
      # ─────────────────────────────────────────────────────────
      - name: "Run 3/10 — Aggregate ETF & fund insights"
        run: |
          python scripts/collector.py
          git add datasets/ scripts/
          if ! git diff --staged --quiet; then
            DATE=$(date +%Y-%m-%d); TIME=$(date +%H:%M:%S)
            git commit -m "data(investment-news): aggregate ETF & fund insights - Run #3" \
              -m "Investment-focused news section added to the data pipeline.

          - Collected investment news from SPY, QQQ, VTI, ARKK, GLD ETFs
          - Built investment_news.csv with structured article metadata
          - Cross-referenced provider sources for article deduplication
          - Collection timestamp: $DATE $TIME UTC"
          else
            echo "Run #3 | $(date -Iseconds) | Collector executed" >> datasets/collection_log.txt
            git add datasets/collection_log.txt
            DATE=$(date +%Y-%m-%d); TIME=$(date +%H:%M:%S)
            git commit -m "data(investment-news): aggregate ETF & fund insights - Run #3" \
              -m "Investment news aggregation cycle.

          - Collection timestamp: $DATE $TIME UTC"
          fi
          sleep 5

      # ─────────────────────────────────────────────────────────
      #  Run 4: Intraday Price Snapshots
      # ─────────────────────────────────────────────────────────
      - name: "Run 4/10 — Refresh intraday price snapshots"
        run: |
          python scripts/collector.py
          git add datasets/ scripts/
          if ! git diff --staged --quiet; then
            DATE=$(date +%Y-%m-%d); TIME=$(date +%H:%M:%S)
            git commit -m "data(pricing): refresh intraday price snapshots - Run #4" \
              -m "Refreshed intraday price snapshots for all tracked tickers.

          - NIFTY 50 (^NSEI) and SENSEX (^BSESN) index data updated
          - Crypto assets (BTC-USD, ETH-USD) pricing captured
          - US tech giants (AAPL, MSFT, GOOGL, TSLA, NVDA) data ingested
          - Indian blue-chips (RELIANCE.NS, TCS.NS, HDFCBANK.NS, INFY.NS) refreshed
          - Collection timestamp: $DATE $TIME UTC"
          else
            echo "Run #4 | $(date -Iseconds) | Collector executed" >> datasets/collection_log.txt
            git add datasets/collection_log.txt
            DATE=$(date +%Y-%m-%d); TIME=$(date +%H:%M:%S)
            git commit -m "data(pricing): refresh intraday price snapshots - Run #4" \
              -m "Price snapshot refresh cycle.

          - Collection timestamp: $DATE $TIME UTC"
          fi
          sleep 5

      # ─────────────────────────────────────────────────────────
      #  Run 5: Master Dataset + Volume Analytics
      # ─────────────────────────────────────────────────────────
      - name: "Run 5/10 — Update master dataset with volume analytics"
        run: |
          python scripts/collector.py
          git add datasets/ scripts/
          if ! git diff --staged --quiet; then
            DATE=$(date +%Y-%m-%d); TIME=$(date +%H:%M:%S)
            git commit -m "data(pipeline): update master dataset with volume analytics - Run #5" \
              -m "Master dataset updated with fresh volume and price analytics.

          - Appended latest price/volume records to master_dataset.csv
          - Volume data captured for institutional activity tracking
          - High/Low spread recorded for volatility analysis
          - Collection timestamp: $DATE $TIME UTC"
          else
            echo "Run #5 | $(date -Iseconds) | Collector executed" >> datasets/collection_log.txt
            git add datasets/collection_log.txt
            DATE=$(date +%Y-%m-%d); TIME=$(date +%H:%M:%S)
            git commit -m "data(pipeline): update master dataset with volume analytics - Run #5" \
              -m "Volume analytics update cycle.

          - Collection timestamp: $DATE $TIME UTC"
          fi
          sleep 5

      # ─────────────────────────────────────────────────────────
      #  Run 6: Business & Investment News Refresh
      # ─────────────────────────────────────────────────────────
      - name: "Run 6/10 — Refresh business & investment news feeds"
        run: |
          python scripts/collector.py
          git add datasets/ scripts/
          if ! git diff --staged --quiet; then
            DATE=$(date +%Y-%m-%d); TIME=$(date +%H:%M:%S)
            git commit -m "data(news): refresh business & investment news feeds - Run #6" \
              -m "Comprehensive news refresh across business and investment categories.

          - Business news: Global market headlines from major indices & commodities
          - Investment news: Fund-level insights from top ETFs (SPY, QQQ, VTI, ARKK)
          - All articles timestamped and provider-attributed
          - News CSVs updated for downstream ML feature engineering
          - Collection timestamp: $DATE $TIME UTC"
          else
            echo "Run #6 | $(date -Iseconds) | Collector executed" >> datasets/collection_log.txt
            git add datasets/collection_log.txt
            DATE=$(date +%Y-%m-%d); TIME=$(date +%H:%M:%S)
            git commit -m "data(news): refresh business & investment news feeds - Run #6" \
              -m "News feeds refresh cycle.

          - Collection timestamp: $DATE $TIME UTC"
          fi
          sleep 5

      # ─────────────────────────────────────────────────────────
      #  Run 7: Cryptocurrency Pricing & Sentiment
      # ─────────────────────────────────────────────────────────
      - name: "Run 7/10 — Update cryptocurrency pricing & sentiment"
        run: |
          python scripts/collector.py
          git add datasets/ scripts/
          if ! git diff --staged --quiet; then
            DATE=$(date +%Y-%m-%d); TIME=$(date +%H:%M:%S)
            git commit -m "data(crypto): update cryptocurrency pricing & sentiment - Run #7" \
              -m "Cryptocurrency market data refresh.

          - Bitcoin (BTC-USD) and Ethereum (ETH-USD) prices updated
          - Associated crypto news headlines captured for sentiment signals
          - Price change deltas calculated for trend tracking
          - Collection timestamp: $DATE $TIME UTC"
          else
            echo "Run #7 | $(date -Iseconds) | Collector executed" >> datasets/collection_log.txt
            git add datasets/collection_log.txt
            DATE=$(date +%Y-%m-%d); TIME=$(date +%H:%M:%S)
            git commit -m "data(crypto): update cryptocurrency pricing & sentiment - Run #7" \
              -m "Crypto pricing refresh cycle.

          - Collection timestamp: $DATE $TIME UTC"
          fi
          sleep 5

      # ─────────────────────────────────────────────────────────
      #  Run 8: Indian & US Equity Positions
      # ─────────────────────────────────────────────────────────
      - name: "Run 8/10 — Update Indian & US equity positions"
        run: |
          python scripts/collector.py
          git add datasets/ scripts/
          if ! git diff --staged --quiet; then
            DATE=$(date +%Y-%m-%d); TIME=$(date +%H:%M:%S)
            git commit -m "data(equities): update Indian & US equity positions - Run #8" \
              -m "Equity market data refresh for tracked Indian and US stocks.

          - Indian equities: RELIANCE, TCS, HDFC Bank, Infosys (NSE)
          - US equities: Apple, Microsoft, Google, Tesla, NVIDIA (NASDAQ/NYSE)
          - Market indices: NIFTY 50, SENSEX, Dow Jones, S&P 500, NASDAQ Composite
          - Volume and price movement data appended to historical records
          - Collection timestamp: $DATE $TIME UTC"
          else
            echo "Run #8 | $(date -Iseconds) | Collector executed" >> datasets/collection_log.txt
            git add datasets/collection_log.txt
            DATE=$(date +%Y-%m-%d); TIME=$(date +%H:%M:%S)
            git commit -m "data(equities): update Indian & US equity positions - Run #8" \
              -m "Equity positions refresh cycle.

          - Collection timestamp: $DATE $TIME UTC"
          fi
          sleep 5

      # ─────────────────────────────────────────────────────────
      #  Run 9: Gold & Crude Oil Commodities
      # ─────────────────────────────────────────────────────────
      - name: "Run 9/10 — Track gold & crude oil market signals"
        run: |
          python scripts/collector.py
          git add datasets/ scripts/
          if ! git diff --staged --quiet; then
            DATE=$(date +%Y-%m-%d); TIME=$(date +%H:%M:%S)
            git commit -m "data(commodities): track gold & crude oil market signals - Run #9" \
              -m "Commodity market signals captured alongside equity data.

          - Gold Futures (GC=F) and Crude Oil Futures (CL=F) news aggregated
          - Commodity-related business headlines stored for macro analysis
          - Cross-asset correlation data points accumulated in master dataset
          - Collection timestamp: $DATE $TIME UTC"
          else
            echo "Run #9 | $(date -Iseconds) | Collector executed" >> datasets/collection_log.txt
            git add datasets/collection_log.txt
            DATE=$(date +%Y-%m-%d); TIME=$(date +%H:%M:%S)
            git commit -m "data(commodities): track gold & crude oil market signals - Run #9" \
              -m "Commodity signals tracking cycle.

          - Collection timestamp: $DATE $TIME UTC"
          fi
          sleep 5

      # ─────────────────────────────────────────────────────────
      #  Run 10: Daily Digest — Final Collection Cycle
      # ─────────────────────────────────────────────────────────
      - name: "Run 10/10 — Complete daily market data collection cycle"
        run: |
          python scripts/collector.py
          git add datasets/ scripts/
          if ! git diff --staged --quiet; then
            DATE=$(date +%Y-%m-%d); TIME=$(date +%H:%M:%S)
            git commit -m "data(daily-digest): complete market data collection cycle - Run #10" \
              -m "Final collection run completing the daily data ingestion cycle.

          - Full pipeline executed: stock prices -> business news -> investment news
          - All CSVs updated: master_dataset.csv, business_news.csv, investment_news.csv
          - Daily JSON snapshot finalized: financial_data_$DATE.json
          - 13 core tickers + 5 business sources + 5 investment sources tracked
          - Collection timestamp: $DATE $TIME UTC

          Pipeline: scripts/collector.py -> datasets/"
          else
            echo "Run #10 | $(date -Iseconds) | Collector executed" >> datasets/collection_log.txt
            git add datasets/collection_log.txt
            DATE=$(date +%Y-%m-%d); TIME=$(date +%H:%M:%S)
            git commit -m "data(daily-digest): complete market data collection cycle - Run #10" \
              -m "Daily digest finalization cycle.

          - Collection timestamp: $DATE $TIME UTC
          Pipeline: scripts/collector.py -> datasets/"
          fi

      # ─────────────────────────────────────────────────────────
      #  Push all 10 commits to GitHub
      # ─────────────────────────────────────────────────────────
      - name: Push all commits to GitHub
        run: |
          git pull --rebase origin main || true
          git push origin main
